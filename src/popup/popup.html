<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="popupTitle"></title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="../../icons/icon48.png" alt="" class="header-logo">
            <h1>EZ Translate</h1>
        </header>
        <div class="input-container">
            <textarea id="text-input" rows="5" data-i18n-placeholder="textInputPlaceholder"></textarea>
            <button id="speak-input-button" class="icon-ghost-button speak-button" style="display: none;" aria-label="Speak">
                <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
        </div>
        <div class="actions">
            <select id="target-language">
            </select>
            <button id="translate-button" data-i18n="translateButton"></button>
        </div>
        <div class="result-container" id="result-container">
            <p id="translation-result"></p>
            <div class="result-actions">
                <button id="copy-button" class="icon-ghost-button speak-button" style="display: none;" aria-label="Copy">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                </button>
                <button id="speak-button" class="icon-ghost-button speak-button" style="display: none;" aria-label="Speak">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                </button>
            </div>
        </div>
        <div class="settings-container">
            <div class="setting-item">
                <label for="selection-translate-toggle" data-i18n="selectionTranslateLabel"></label>
                <label class="switch">
                    <input type="checkbox" id="selection-translate-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="right-icons">
                <button id="floating-panel-button" class="icon-button" title="Floating translator">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                </button>
                <button id="screenshot-translate-button" class="icon-button" data-i18n-title="screenshotTranslateButton" title="Image Translate">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <button id="settings-icon-button" class="icon-button" data-i18n-title="settingsLink" title="Settings">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </div>
        <details class="selection-settings">
            <summary data-i18n="selectionSettingsLabel"></summary>
            <div class="selection-setting-item">
                <label for="disable-editable-toggle" data-i18n="disableTranslationInEditableLabel"></label>
                <label class="switch">
                    <input type="checkbox" id="disable-editable-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="selection-setting-item">
                <label for="auto-translate-toggle" data-i18n="translateOnSelectionLabel"></label>
                <label class="switch">
                    <input type="checkbox" id="auto-translate-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="selection-setting-item">
                <label for="require-ctrl-toggle" data-i18n="requireCtrlOnSelectionLabel"></label>
                <label class="switch">
                    <input type="checkbox" id="require-ctrl-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <p id="combined-selection-hint" class="combined-selection-hint" data-i18n="combinedSelectionHint" hidden></p>
        </details>
    </div>
    <script src="../shared/markdown.js"></script>
    <script src="../shared/translation-timing.js"></script>
    <script src="popup.js"></script>
</body>
</html>
